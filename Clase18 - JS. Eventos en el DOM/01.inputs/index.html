<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LClase 18 - DOM. Input</title>
  </head>

  <body>
    <label for="texto">Texto</label>
    <input type="text" name="texto" id="texto" />

    <label for="textColor">Color de Texto</label>
    <input type="color" name="textColor" id="textColor" />

    <label for="textSize">Tamaño de Texto</label>
    <input type="number" value="18" name="textSize" id="textSize" />

    <label for="colorBG">Color de Fondo</label>
    <input type="color" name="colorBG" id="colorBG" />

    <p id="resultado">Resultado</p>

    <script src="index.js"></script>
  </body>
</html>
