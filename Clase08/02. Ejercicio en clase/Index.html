
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 08 - Responsive Desing - Ejemplo Practico</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- link al CSS de estilos -->
    <link rel="stylesheet" href="styles/style.css">

    <link rel="icon" type="image/png"  href="./images/favicon-32x32.png">

</head>

<body>
    
    <article>

        <div class="cont-imagenes">
            <img class="imagen-pc" src="./images/image-product-desktop.jpg" alt="Imagen producto">
            <img class="imagen-mobile" src="./images/image-product-mobile.jpg" alt="Imagen producto para mobile">
        </div>

        <div class="cont-textos">
            <h3 class="text-categoria">Perfume</h3>
            <h2 class="text-titulo">Gabrielle Essence Eau De Parfum</h2>
            <p class="text-descripcion">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL. </p>
            <div class="cont-precios">
                <p class="precio-oferta">$149.99</p>
                <p class="precio-real">$169.99</p>
            </div>
            <button><img src="./images/icon-cart.svg" alt="icono carrito"> Add to Cart </button>
        </div>

    </article>


    <footer>
        <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge"">Frontend Mentor</a>. Coded by <a href="#">Your Name Here</a>. </p>
    </footer>

</body>
</html>
